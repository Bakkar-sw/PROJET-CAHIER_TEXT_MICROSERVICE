server:
  port: 8081
  servlet:
    context-path: /api/auth

spring:
  application:
    name: auth-service

  # Configuration Base de données SQL Server
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=cahier_texte_db_micro;encrypt=true;trustServerCertificate=true
    username: administrateur
    password: MotDePasse123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  # Configuration JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update # Utiliser 'validate' en production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        
  # Configuration Jackson (JSON)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Dakar

# Configuration JWT
jwt:
  secret: votre-cle-secrete-ultra-secure-minimum-256-bits-pour-HS256-algorithm-changez-moi-en-production
  expiration: 86400000 # 24 heures en millisecondes

# Configuration Logging
logging:
  level:
    root: INFO
    com.cahiertexte.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    
# Configuration Feign (pour appeler d'autres services)
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

# Configuration CORS
cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  exposed-headers: Authorization
  allow-credentials: true
  max-age: 3600
