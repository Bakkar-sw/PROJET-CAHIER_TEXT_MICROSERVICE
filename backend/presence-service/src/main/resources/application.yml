server:
  port: 8084
  servlet:
    context-path: /api/presences


spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=cahier_texte_db_micro;encrypt=true;trustServerCertificate=true
    username: springuser
    password: Spring123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
