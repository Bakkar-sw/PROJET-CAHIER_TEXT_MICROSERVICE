server:
  port: 8085
  servlet:
    context-path: /api/justificatifs

spring:
  application:
    name: justificatif-service

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=cahier_texte_db;encrypt=true;trustServerCertificate=true
    username: admincahiertxt
    password: VotreMotDePasse
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Dakar

  # Configuration upload de fichiers
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: votre-cle-secrete-ultra-secure-minimum-256-bits-pour-HS256-algorithm-changez-moi-en-production
  expiration: 86400000

logging:
  level:
    root: INFO
    com.cahiertexte.justificatif: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      user-service:
        url: http://localhost:8082
      cours-service:
        url: http://localhost:8083
      presence-service:
        url: http://localhost:8084

cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  exposed-headers: Authorization
  allow-credentials: true
  max-age: 3600

# Configuration chemin des fichiers uploadés
upload:
  path: /home/claude/cahier-texte-microservices/uploads/justificatifs
